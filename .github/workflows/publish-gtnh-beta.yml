name: Publish GTNH beta test image

on:
  push:
    branches:
      - test/gtnh-beta-fix

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and publish Java 21 image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          pull: true
          tags: ghcr.io/wowsuchricky/minecraft-server:gtnh-beta-fix-${{ github.sha }}
          build-args: |
            BASE_IMAGE=eclipse-temurin:21-jre
            VERSION=gtnh-beta-fix-${{ github.sha }}
            REVISION=${{ github.sha }}
